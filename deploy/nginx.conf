events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Debug log format for URL and folder path mapping
    log_format debug '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent '
                     'version="$sent_http_x_debug_version" '
                     'original_url="$sent_http_x_debug_original_url" '
                     'folder_path="$sent_http_x_debug_folder_path" '
                     'full_target="$sent_http_x_debug_full_target_path"';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/debug.log debug;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Enable URL decoding for Chinese characters and iframe support
        charset utf-8;

        # Dynamic version routing for x.y.z version numbers
        # Matches version pattern like 3.0.0, 3.0.1, 4.1.2, etc.
        location ~ ^/([0-9]+\.[0-9]+\.[0-9]+)(.*)$ {
            set $version $1;
            set $path $2;
            set $folder_path "/versions/$version";

            # Debug headers - URL and folder mapping
            add_header X-Debug-Original-URL $request_uri always;
            add_header X-Debug-Version $version always;
            add_header X-Debug-Path $path always;
            add_header X-Debug-Folder-Path $folder_path always;
            add_header X-Debug-Full-Target-Path "$folder_path$path" always;

            # If empty path or just slash, serve system.html
            if ($path ~ "^/?$") {
                rewrite ^ /versions/$version/system.html break;
            }

            # Otherwise, serve the requested file
            rewrite ^/[0-9]+\.[0-9]+\.[0-9]+(.*)$ /versions/$version$1 break;

            # Try to serve the file
            try_files $uri =404;
        }

        # Dynamic version routing for x.y version numbers
        # Matches version pattern like 3.0, 4.1, etc.
        location ~ ^/([0-9]+\.[0-9]+)(.*)$ {
            set $version $1;
            set $path $2;
            set $folder_path "/versions/$version";

            # Debug headers - URL and folder mapping
            add_header X-Debug-Original-URL $request_uri always;
            add_header X-Debug-Version $version always;
            add_header X-Debug-Path $path always;
            add_header X-Debug-Folder-Path $folder_path always;
            add_header X-Debug-Full-Target-Path "$folder_path$path" always;

            # If empty path or just slash, serve system.html
            if ($path ~ "^/?$") {
                rewrite ^ /versions/$version/system.html break;
            }

            # Otherwise, serve the requested file
            rewrite ^/[0-9]+\.[0-9]+(.*)$ /versions/$version$1 break;

            # Try to serve the file
            try_files $uri =404;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Cache static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Default fallback
        location / {
            return 404;
        }
    }
}
